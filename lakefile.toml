name = "pillow-problems"
version = "0.1.0"
keywords = ["math", "lewis-carroll", "problems", "benchmark"]
defaultTargets = ["PillowProblems"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
# mathlib release tag v4.36.0 (commit fc4f59e577feb1a4956671bc04ac18aaaf8cd842), matching lean-toolchain
rev = "v4.36.0"

[[lean_lib]]
name = "PillowProblems"

# Statements only, every proof replaced by `sorry` (generated by scripts/make_benchmark.py).
[[lean_lib]]
name = "Benchmark"
