name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain from lean-toolchain, fetches the mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1

      - name: Axiom audit (no sorry, only standard axioms)
        run: lake env lean scripts/AxiomsAudit.lean

      - name: Problem map is complete and honest
        run: |
          python3 scripts/problem_table.py --check
          git diff --exit-code docs/PROBLEMS.md || (echo "docs/PROBLEMS.md is stale: run scripts/problem_table.py" && exit 1)

      - name: Benchmark statements match the reference solutions and build
        run: |
          python3 scripts/make_benchmark.py
          git diff --exit-code Benchmark Benchmark.lean || (echo "Benchmark/ is stale: run scripts/make_benchmark.py" && exit 1)
          lake build Benchmark
